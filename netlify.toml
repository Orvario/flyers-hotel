[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's OpenNext-based Next.js runtime: route handlers such as
# /api/availability are deployed as serverless functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"
